name: Manage Datadog Synthetic Monitor

on:
  workflow_dispatch:
    inputs:
      cname:
        description: "CNAME (domain) of the synthetic test to manage"
        required: true
        type: string
      delete_monitor:
        description: "Delete the monitor after pausing?"
        required: true
        type: choice
        options:
          - "No"
          - "Yes"
        default: "No"

env:
  DD_ACCESS_TOKEN: ${{ secrets.DD_ACCESS_TOKEN }}
  DD_SITE: "us3.datadoghq.com"  # Change to your Datadog site

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Find and Pause the Synthetic test
  # ──────────────────────────────────────────────
  pause-monitor:
    runs-on: ubuntu-latest
    outputs:
      public_id: ${{ steps.find-test.outputs.public_id }}
      test_name: ${{ steps.find-test.outputs.test_name }}
    steps:
      - name: Find Synthetic test by CNAME
        id: find-test
        run: |
          CNAME="${{ inputs.cname }}"
          echo "🔍 Searching for synthetic tests matching CNAME: ${CNAME}"

          RESPONSE=$(curl -s -X GET \
            "https://api.${DD_SITE}/api/v1/synthetics/tests/search?query=${CNAME}" \
            -H "Authorization: Bearer ${DD_ACCESS_TOKEN}" \
            -H "Accept: application/json")

          # Debug: print raw response
          echo "📋 API Response:"
          echo "$RESPONSE" | jq . 2>/dev/null || echo "$RESPONSE"

          # Check for API errors
          API_ERROR=$(echo "$RESPONSE" | jq -r '.errors // empty' 2>/dev/null)
          if [ -n "$API_ERROR" ]; then
            echo "❌ API error: ${API_ERROR}"
            exit 1
          fi

          # Check if tests exist
          TEST_COUNT=$(echo "$RESPONSE" | jq '.tests // [] | length')
          if [ "$TEST_COUNT" -eq 0 ]; then
            echo "❌ No synthetic tests found matching: ${CNAME}"
            exit 1
          fi

          echo "📊 Found ${TEST_COUNT} test(s). Filtering by URL..."

          PUBLIC_ID=$(echo "$RESPONSE" | jq -r \
            --arg cname "$CNAME" \
            '[.tests[] | select(.config.request.url // "" | ascii_downcase | contains($cname | ascii_downcase))] | .[0].public_id // empty')

          TEST_NAME=$(echo "$RESPONSE" | jq -r \
            --arg cname "$CNAME" \
            '[.tests[] | select(.config.request.url // "" | ascii_downcase | contains($cname | ascii_downcase))] | .[0].name // empty')

          if [ -z "$PUBLIC_ID" ]; then
            echo "❌ No test URL matches CNAME: ${CNAME}"
            echo "   Returned test URLs:"
            echo "$RESPONSE" | jq -r '.tests[].config.request.url // "N/A"'
            exit 1
          fi

          echo "✅ Found test: ${TEST_NAME} (ID: ${PUBLIC_ID})"
          echo "public_id=${PUBLIC_ID}" >> "$GITHUB_OUTPUT"
          echo "test_name=${TEST_NAME}" >> "$GITHUB_OUTPUT"

      - name: Pause Synthetic test
        run: |
          PUBLIC_ID="${{ steps.find-test.outputs.public_id }}"
          TEST_NAME="${{ steps.find-test.outputs.test_name }}"

          echo "⏸️  Pausing test: ${TEST_NAME} (${PUBLIC_ID})"

          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X PUT \
            "https://api.${DD_SITE}/api/v1/synthetics/tests/${PUBLIC_ID}/status" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${DD_ACCESS_TOKEN}" \
            -d '{"new_status": "paused"}')

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Successfully paused test: ${TEST_NAME}"
          else
            echo "❌ Failed to pause test. HTTP status: ${HTTP_CODE}"
            cat response.json
            exit 1
          fi

      - name: Deletion choice summary
        run: |
          if [ "${{ inputs.delete_monitor }}" == "Yes" ]; then
            echo "⚠️  User chose YES — proceeding to delete the monitor."
          else
            echo "ℹ️  User chose NO — monitor is paused. Skipping deletion."
          fi

  # ──────────────────────────────────────────────
  # Job 2: Delete (only if user chose "Yes")
  # ──────────────────────────────────────────────
  delete-monitor:
    runs-on: ubuntu-latest
    needs: pause-monitor
    if: ${{ inputs.delete_monitor == 'Yes' }}
    steps:
      - name: Delete Synthetic test
        run: |
          PUBLIC_ID="${{ needs.pause-monitor.outputs.public_id }}"
          TEST_NAME="${{ needs.pause-monitor.outputs.test_name }}"

          echo "🗑️  Deleting test: ${TEST_NAME} (${PUBLIC_ID})"

          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "https://api.${DD_SITE}/api/v1/synthetics/tests/delete" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${DD_ACCESS_TOKEN}" \
            -d "{\"public_ids\": [\"${PUBLIC_ID}\"]}")

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Successfully deleted test: ${TEST_NAME}"
          else
            echo "❌ Failed to delete test. HTTP status: ${HTTP_CODE}"
            cat response.json
            exit 1
          fi

  # ──────────────────────────────────────────────
  # Job 3: Summary
  # ──────────────────────────────────────────────
  summary:
    runs-on: ubuntu-latest
    needs: [pause-monitor, delete-monitor]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "══════════════════════════════════════"
          echo "  WORKFLOW SUMMARY"
          echo "══════════════════════════════════════"
          echo "  CNAME:          ${{ inputs.cname }}"
          echo "  Test Name:      ${{ needs.pause-monitor.outputs.test_name }}"
          echo "  Test ID:        ${{ needs.pause-monitor.outputs.public_id }}"
          echo "  Paused:         ✅"
          if [ "${{ inputs.delete_monitor }}" == "Yes" ]; then
            echo "  Deleted:        ✅"
          else
            echo "  Deleted:        ⏭️  Skipped (user chose No)"
          fi
          echo "══════════════════════════════════════"